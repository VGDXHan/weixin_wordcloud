[package]
name = "weixin-wordcloud"
version = "0.1.0"
description = "微信聊天词云生成器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jieba-rs = "0.7"
regex = "1"
once_cell = "1"
thiserror = "2"
libloading = "0.8"

# Self-implemented SQLCipher-4 page decryption (we hold the raw key from
# wx_key.dll, so we skip the key KDF and decrypt pages ourselves, then read
# the plaintext copy with a plain bundled SQLite).
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hex = "0.4"
zstd = "0.13"
# Local-time rendering for exported timestamps / file names.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
strip = true
lto = true
